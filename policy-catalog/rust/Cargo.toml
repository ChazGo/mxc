[package]
name = "mxc-policy-catalog"
version = "0.0.0-prototype"
edition = "2021"
rust-version = "1.93"
license = "MIT"
publish = false
description = "PROTOTYPE of the known-tool policy catalog library (native Rust). Not published; the crate name is a placeholder until a dedicated repository exists."
build = "build.rs"
# Only these files ship in the .crate. `catalog/` is git-ignored (a copy of
# ../catalog made by scripts/sync-catalog.mjs) and must be listed here.
include = [
    "Cargo.toml",
    "Cargo.lock",
    "build.rs",
    "README.md",
    "rust-toolchain.toml",
    "src/**/*.rs",
    "catalog/contract.v1.json",
    "catalog/manifest.json",
    "catalog/revisions/*.json",
]

# A standalone workspace: never part of an enclosing Cargo workspace.
[workspace]

[lib]
name = "mxc_policy_catalog"
path = "src/lib.rs"

[[bin]]
name = "policy-catalog"
path = "src/bin/policy-catalog.rs"

[dependencies]
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
# uname(2) for the kernel machine type (Node `os.machine()`), Linux/macOS only.
libc = "0.2"
